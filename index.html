<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MChat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { discord: '#36393f', discordDark: '#2f3136', discordDarker: '#202225' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #36393f; color: #dcddde; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2f3136; }
        ::-webkit-scrollbar-thumb { background: #202225; border-radius: 4px; }
        .hide { display: none !important; }
        .message-bubble { max-width: 70%; word-wrap: break-word; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { background: #4f545c; color: white; padding: 12px 20px; border-radius: 4px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; }
    </style>
    
    <!-- Firebase Modular SDK v11 -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js"
      }
    }
    </script>
</head>
<body class="h-screen w-screen flex antialiased">

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-discord">
        <div class="bg-discordDark p-8 rounded-lg shadow-xl text-center w-96">
            <h1 class="text-3xl font-bold mb-6 text-white"><i class="fa-solid fa-comments text-blue-500"></i> MChat</h1>
            <p class="mb-6 text-gray-400">Войдите, чтобы начать общение</p>
            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                <i class="fa-brands fa-google mr-2"></i> Войти через Google
            </button>
        </div>
    </div>

    <!-- Setup Profile Modal -->
    <div id="setup-modal" class="hide absolute inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70">
        <div class="bg-discordDark p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-4 text-white">Настройка профиля</h2>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">Уникальное имя пользователя</label>
                <input type="text" id="setup-username" class="w-full bg-discordDarker text-white p-2 rounded border border-gray-600 focus:border-blue-500 focus:outline-none" placeholder="@username">
                <p id="setup-error" class="text-red-500 text-xs mt-1 hide"></p>
            </div>
            <button id="btn-save-setup" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Сохранить</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hide flex w-full h-full">
        <!-- Sidebar -->
        <div class="w-80 bg-discordDark flex flex-col border-r border-discordDarker">
            <!-- Header/Profile -->
            <div class="p-4 bg-discordDarker flex justify-between items-center shadow-md">
                <div class="flex items-center cursor-pointer hover:opacity-80" id="btn-my-profile">
                    <img id="my-avatar" src="" class="w-10 h-10 rounded-full mr-3 object-cover">
                    <div>
                        <div id="my-name" class="font-bold text-white text-sm"></div>
                        <div id="my-username" class="text-xs text-gray-400"></div>
                    </div>
                </div>
                <button id="btn-logout" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-sign-out-alt"></i></button>
            </div>

            <!-- Search -->
            <div class="p-3">
                <div class="relative">
                    <input type="text" id="search-input" class="w-full bg-discord text-sm text-white p-2 pl-8 rounded focus:outline-none" placeholder="Поиск по @username...">
                    <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-gray-400"></i>
                </div>
            </div>

            <!-- Search Results -->
            <div id="search-results" class="hide flex-1 overflow-y-auto p-2"></div>

            <!-- Chats List -->
            <div id="chats-list" class="flex-1 overflow-y-auto p-2"></div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col bg-discord relative" id="chat-area">
            <!-- Placeholder -->
            <div id="chat-placeholder" class="flex-1 flex items-center justify-center flex-col text-gray-500">
                <i class="fa-solid fa-messages text-6xl mb-4"></i>
                <h2 class="text-xl">Выберите чат для общения</h2>
            </div>

            <!-- Active Chat -->
            <div id="active-chat" class="hide flex-1 flex flex-col h-full w-full">
                <!-- Chat Header -->
                <div class="h-16 border-b border-discordDarker flex items-center px-6 shadow-sm bg-discord flex-shrink-0">
                    <img id="current-chat-avatar" src="" class="w-10 h-10 rounded-full mr-3 object-cover">
                    <div class="flex-1">
                        <div id="current-chat-name" class="font-bold text-white"></div>
                        <div id="current-chat-status" class="text-xs text-gray-400"></div>
                    </div>
                </div>

                <!-- Messages -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4"></div>

                <!-- Input Area -->
                <div class="p-4 bg-discordDark flex-shrink-0">
                    <div class="bg-discordDarker rounded-lg flex items-center p-2 relative">
                        <input type="file" id="file-upload" class="hide" accept="image/*, .pdf, .doc, .zip">
                        <button id="btn-attach" class="text-gray-400 hover:text-white px-3"><i class="fa-solid fa-paperclip"></i></button>
                        <input type="text" id="message-input" class="flex-1 bg-transparent text-white focus:outline-none px-2" placeholder="Написать сообщение...">
                        <button id="btn-send" class="text-blue-500 hover:text-blue-400 px-3"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                    <div id="upload-progress" class="hide w-full bg-gray-700 rounded-full h-1.5 mt-2">
                        <div id="upload-bar" class="bg-blue-600 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, onSnapshot, addDoc, serverTimestamp, orderBy, updateDoc } from "firebase/firestore";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "firebase/storage";

        // ==========================================
        // ВСТАВЬТЕ ВАШ FIREBASE CONFIG СЮДА
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyYourApiKeyHere",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Global State
        let currentUserData = null;
        let currentChatId = null;
        let currentChatUser = null;
        let unsubscribeMessages = null;
        let unsubscribeChats = null;
        let unsubscribeUserStatus = null;

        // UI Helpers
        const el = (id) => document.getElementById(id);
        const show = (e) => e.classList.remove('hide');
        const hide = (e) => e.classList.add('hide');

        function showToast(message) {
            const container = el('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
            
            if (typeof Notification !== 'undefined' && Notification.permission === "granted") {
                try { new Notification("MChat", { body: message }); } catch(e) {}
            }
        }

        // --- AUTH & PRESENCE ---
        const provider = new GoogleAuthProvider();

        el('btn-login').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login error:", error);
                alert("Ошибка входа: " + error.message);
            }
        });

        el('btn-logout').addEventListener('click', async () => {
            try {
                if (auth.currentUser) {
                    await updateDoc(doc(db, "users", auth.currentUser.uid), { isOnline: false, lastSeen: serverTimestamp() });
                }
            } catch(e) { console.error(e); }
            await signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            try {
                if (user) {
                    hide(el('login-screen'));
                    if (typeof Notification !== 'undefined' && Notification.requestPermission) {
                        Notification.requestPermission().catch(err => console.log("Notifications blocked:", err));
                    }
                    await checkAndLoadProfile(user);
                } else {
                    show(el('login-screen'));
                    hide(el('main-app'));
                    hide(el('setup-modal'));
                    currentUserData = null;
                }
            } catch (globalError) {
                console.error("Auth state error:", globalError);
                alert("Критическая ошибка инициализации: " + globalError.message);
                show(el('login-screen'));
            }
        });

        window.addEventListener('beforeunload', () => {
            if (auth.currentUser && currentUserData) {
                updateDoc(doc(db, "users", auth.currentUser.uid), { isOnline: false, lastSeen: serverTimestamp() });
            }
        });

        async function checkAndLoadProfile(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    currentUserData = userSnap.data();
                    await updateDoc(userRef, { isOnline: true });
                    initAppUI();
                } else {
                    show(el('setup-modal'));
                }
            } catch (dbError) {
                console.error("Firestore read error:", dbError);
                alert("Ошибка доступа к Базе Данных!\n\nПроверьте, настроили ли вы Правила Безопасности (Security Rules) в панели управления Firebase.\n\nДетали: " + dbError.message);
                show(el('login-screen'));
            }
        }

        // --- SETUP PROFILE ---
        el('btn-save-setup').addEventListener('click', async () => {
            const username = el('setup-username').value.trim().toLowerCase();
            const errorEl = el('setup-error');
            
            if (username.length < 3) {
                errorEl.textContent = "Имя должно быть от 3 символов"; show(errorEl); return;
            }
            if (/[^a-z0-9_]/.test(username)) {
                errorEl.textContent = "Только латинские буквы, цифры и _"; show(errorEl); return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    errorEl.textContent = "Это имя уже занято"; show(errorEl); return;
                }

                const user = auth.currentUser;
                const newUserData = {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || username,
                    photoURL: user.photoURL || 'https://ui-avatars.com/api/?name=' + username,
                    username: username,
                    bio: 'Привет! Я использую MChat.',
                    createdAt: serverTimestamp(),
                    isOnline: true,
                    lastSeen: serverTimestamp()
                };

                await setDoc(doc(db, "users", user.uid), newUserData);
                currentUserData = newUserData;
                hide(el('setup-modal'));
                initAppUI();
            } catch(err) {
                errorEl.textContent = "Ошибка сохранения: " + err.message;
                show(errorEl);
            }
        });

        // --- MAIN APP INIT ---
        function initAppUI() {
            show(el('main-app'));
            el('my-avatar').src = currentUserData.photoURL;
            el('my-name').textContent = currentUserData.displayName;
            el('my-username').textContent = "@" + currentUserData.username;
            loadChatsList();
        }

        // --- SEARCH USERS ---
        el('search-input').addEventListener('input', async (e) => {
            const val = e.target.value.trim().toLowerCase().replace('@', '');
            const resContainer = el('search-results');
            const chatsList = el('chats-list');
            
            if (!val) {
                hide(resContainer); show(chatsList); return;
            }

            hide(chatsList); show(resContainer);
            resContainer.innerHTML = '<div class="text-gray-500 text-center text-sm p-4">Поиск...</div>';

            try {
                const q = query(collection(db, "users"), where("username", ">=", val), where("username", "<=", val + '\uf8ff'));
                const snaps = await getDocs(q);
                
                resContainer.innerHTML = '';
                if(snaps.empty) {
                    resContainer.innerHTML = '<div class="text-gray-500 text-center text-sm p-4">Ничего не найдено</div>';
                    return;
                }

                snaps.forEach(docSnap => {
                    const u = docSnap.data();
                    if (u.uid === currentUserData.uid) return;
                    
                    const div = document.createElement('div');
                    div.className = 'flex items-center p-2 hover:bg-discordDarker rounded cursor-pointer transition mb-1';
                    div.innerHTML = `
                        <img src="${u.photoURL}" class="w-10 h-10 rounded-full mr-3 object-cover">
                        <div><div class="text-white text-sm font-bold">${u.displayName}</div><div class="text-gray-400 text-xs">@${u.username}</div></div>
                    `;
                    div.onclick = () => openChatWith(u);
                    resContainer.appendChild(div);
                });
            } catch(err) {
                resContainer.innerHTML = '<div class="text-red-500 text-center text-xs p-4">Ошибка поиска</div>';
            }
        });

        // --- CHAT LOGIC ---
        async function openChatWith(otherUser) {
            try {
                const q = query(collection(db, "chats"), where("participants", "array-contains", currentUserData.uid));
                const chatsSnap = await getDocs(q);
                
                let chatId = null;
                chatsSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.type === 'direct' && data.participants.includes(otherUser.uid)) {
                        chatId = docSnap.id;
                    }
                });

                if (!chatId) {
                    const newChatRef = await addDoc(collection(db, "chats"), {
                        type: 'direct',
                        participants: [currentUserData.uid, otherUser.uid],
                        updatedAt: serverTimestamp(),
                        lastMessage: ''
                    });
                    chatId = newChatRef.id;
                }

                el('search-input').value = '';
                hide(el('search-results'));
                show(el('chats-list'));

                loadChat(chatId, otherUser);
            } catch(e) {
                alert("Не удалось открыть чат: " + e.message);
            }
        }

        function loadChat(chatId, otherUser) {
            currentChatId = chatId;
            currentChatUser = otherUser;
            
            hide(el('chat-placeholder'));
            show(el('active-chat'));
            
            el('current-chat-name').textContent = otherUser.displayName;
            el('current-chat-avatar').src = otherUser.photoURL;
            el('current-chat-status').textContent = otherUser.isOnline ? 'Online' : 'Offline';

            if (unsubscribeUserStatus) unsubscribeUserStatus();
            unsubscribeUserStatus = onSnapshot(doc(db, "users", otherUser.uid), (docSnap) => {
                const u = docSnap.data();
                if(u) el('current-chat-status').textContent = u.isOnline ? 'Online' : 'В сети: ' + (u.lastSeen ? new Date(u.lastSeen.toDate()).toLocaleString() : 'недавно');
            });

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = el('messages-container');
                container.innerHTML = '';
                snapshot.forEach(docSnap => {
                    renderMessage(docSnap.data());
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function renderMessage(msg) {
            const isMe = msg.senderId === currentUserData.uid;
            const div = document.createElement('div');
            div.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
            
            let contentHTML = '';
            if (msg.type === 'text') {
                contentHTML = `<div class="p-3 rounded-lg ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-discordDarker text-white rounded-bl-none'} message-bubble">${msg.text}</div>`;
            } else if (msg.type === 'image') {
                contentHTML = `<img src="${msg.fileUrl}" class="rounded-lg max-w-xs max-h-64 object-cover cursor-pointer border border-gray-600">`;
            } else if (msg.type === 'file') {
                contentHTML = `<a href="${msg.fileUrl}" target="_blank" class="p-3 rounded-lg bg-gray-700 text-blue-400 underline flex items-center gap-2 message-bubble"><i class="fa-solid fa-file"></i> Документ</a>`;
            }

            div.innerHTML = `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[70%]">
                    ${!isMe ? `<span class="text-xs text-gray-400 mb-1 ml-1">${currentChatUser.displayName}</span>` : ''}
                    ${contentHTML}
                    <span class="text-[10px] text-gray-500 mt-1">${msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleTimeString([],{hour: '2-digit', minute:'2-digit'}) : '...'}</span>
                </div>
            `;
            el('messages-container').appendChild(div);
        }

        async function sendMessage(text, type = 'text', fileUrl = null) {
            if (!text && !fileUrl) return;
            if (!currentChatId) return;

            try {
                const msgData = {
                    senderId: currentUserData.uid,
                    text: text,
                    type: type,
                    fileUrl: fileUrl,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "chats", currentChatId, "messages"), msgData);
                await updateDoc(doc(db, "chats", currentChatId), {
                    lastMessage: type === 'image' ? '📸 Изображение' : type === 'file' ? '📂 Файл' : text,
                    updatedAt: serverTimestamp()
                });

                el('message-input').value = '';
            } catch(e) {
                showToast("Ошибка отправки: " + e.message);
            }
        }

        el('btn-send').addEventListener('click', () => sendMessage(el('message-input').value.trim()));
        el('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(e.target.value.trim());
        });

        // --- FILE UPLOAD ---
        el('btn-attach').addEventListener('click', () => el('file-upload').click());
        
        el('file-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;

            const isImage = file.type.startsWith('image/');
            const type = isImage ? 'image' : 'file';

            try {
                const storageRef = ref(storage, `chats/${currentChatId}/${Date.now()}_${file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, file);

                show(el('upload-progress'));
                
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        el('upload-bar').style.width = progress + '%';
                    }, 
                    (error) => {
                        console.error("Upload error", error);
                        hide(el('upload-progress'));
                        showToast("Ошибка загрузки: " + error.message);
                    }, 
                    async () => {
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        hide(el('upload-progress'));
                        el('upload-bar').style.width = '0%';
                        sendMessage('', type, downloadURL);
                    }
                );
            } catch(err) {
                showToast("Ошибка Хранилища: " + err.message);
            }
        });

        // --- CHATS LIST REALTIME ---
        function loadChatsList() {
            if (unsubscribeChats) unsubscribeChats();

            try {
                const q = query(
                    collection(db, "chats"), 
                    where("participants", "array-contains", currentUserData.uid),
                    orderBy("updatedAt", "desc")
                );

                unsubscribeChats = onSnapshot(q, (snapshot) => {
                    const container = el('chats-list');
                    container.innerHTML = '';

                    snapshot.forEach((docIdx) => {
                        const data = docIdx.data();
                        const otherUserId = data.participants.find(id => id !== currentUserData.uid);
                        
                        if (!otherUserId) return;

                        getDoc(doc(db, "users", otherUserId)).then(userSnap => {
                            if(userSnap.exists()){
                                const u = userSnap.data();
                                const div = document.createElement('div');
                                div.className = `flex items-center p-3 hover:bg-discordDarker rounded cursor-pointer transition mb-1 ${currentChatId === docIdx.id ? 'bg-discordDarker' : ''}`;
                                div.innerHTML = `
                                    <div class="relative flex-shrink-0">
                                        <img src="${u.photoURL}" class="w-12 h-12 rounded-full object-cover">
                                        <div class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-discordDark ${u.isOnline ? 'bg-green-500' : 'bg-gray-500'}"></div>
                                    </div>
                                    <div class="ml-3 flex-1 overflow-hidden">
                                        <div class="flex justify-between items-center">
                                            <span class="text-white font-bold truncate">${u.displayName}</span>
                                        </div>
                                        <div class="text-gray-400 text-sm truncate">${data.lastMessage || 'Новый чат'}</div>
                                    </div>
                                `;
                                div.onclick = () => loadChat(docIdx.id, u);
                                container.appendChild(div);
                            }
                        }).catch(e => console.log(e));
                    });
                });
            } catch(e) {
                console.error("Chats list listener error:", e);
            }
        }
    </script>
</body>
</html>
