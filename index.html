<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGram — Зеркало-3</title>

    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: "#0b1120",
                            panel: "#141b2d",
                            bubble: "#1e2a45",
                            line: "#22304a"
                        },
                        brand: {
                            DEFAULT: "#4f7cff",
                            hover: "#3c63e6"
                        },
                        cipher: {
                            DEFAULT: "#37e2b0",
                            dim: "#1f6f57"
                        }
                    }
                }
            }
        }
    </script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            signInAnonymously,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDoc,
            getDocs,
            query,
            where,
            addDoc,
            onSnapshot,
            orderBy,
            serverTimestamp,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCavGRCy4hsLr7_8Onj-TM21xaAd_Vkh2c",
            authDomain: "airgram-66933.firebaseapp.com",
            projectId: "airgram-66933",
            storageBucket: "airgram-66933.firebasestorage.app",
            messagingSenderId: "876946365615",
            appId: "1:876946365615:web:34e5d21fc36d4aa6cf085a"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            // Делаем сервисы доступными глобально
            window.db = db;
            window.auth = auth;
            window.FB_AUTH = {
                signInAnonymously,
                signOut,
                onAuthStateChanged
            };
            window.FB = {
                collection,
                doc,
                setDoc,
                getDoc,
                getDocs,
                query,
                where,
                addDoc,
                onSnapshot,
                orderBy,
                serverTimestamp,
                updateDoc,
                increment
            };

            window.dispatchEvent(new Event("firebase-ready"));
        } catch (error) {
            console.error("Firebase error:", error);
            window.firebaseError = error.message;
            window.dispatchEvent(new Event("firebase-error"));
        }
    </script>

    <style>
        body {
            margin: 0;
            background: #0b1120;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #22304a;
            border-radius: 10px;
        }
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .fade {
            animation: fade .25s ease;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Константы для шифрования ---
        const QWERTY_LEFT = {
            'q': 'p', 'w': 'q', 'e': 'w', 'r': 'e', 't': 'r',
            'y': 't', 'u': 'y', 'i': 'u', 'o': 'i', 'p': 'o',
            'a': 'l', 's': 'a', 'd': 's', 'f': 'd', 'g': 'f',
            'h': 'g', 'j': 'h', 'k': 'j', 'l': 'k',
            'z': 'm', 'x': 'z', 'c': 'x', 'v': 'c',
            'b': 'v', 'n': 'b', 'm': 'n'
        };

        const QWERTY_RIGHT = {
            'p': 'q', 'q': 'w', 'w': 'e', 'e': 'r',
            'r': 't', 't': 'y', 'y': 'u', 'u': 'i',
            'i': 'o', 'o': 'p',
            'l': 'a', 'a': 's', 's': 'd', 'd': 'f',
            'f': 'g', 'g': 'h', 'h': 'j',
            'j': 'k', 'k': 'l',
            'm': 'z', 'z': 'x', 'x': 'c',
            'c': 'v', 'v': 'b', 'b': 'n',
            'n': 'm'
        };

        const TRANSLIT_MAP = {
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g',
            'д': 'd', 'е': 'e', 'ё': 'e', 'ж': 'zh',
            'з': 'z', 'и': 'i', 'й': 'j', 'к': 'k',
            'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o',
            'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
            'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c',
            'ч': 'ch', 'ш': 'sh', 'щ': 'sch',
            'ъ': "'q", 'ы': 'y', 'ь': "'x",
            'э': 'eh', 'ю': 'yu', 'я': 'ya'
        };

        const REVERSE_TRANSLIT = {
            "'q": "ъ",
            "'x": "ь",
            "zh": "ж",
            "ch": "ч",
            "sh": "ш",
            "sch": "щ",
            "eh": "э",
            "yu": "ю",
            "ya": "я",
            "a": "а",
            "b": "б",
            "v": "в",
            "g": "г",
            "d": "д",
            "e": "е",
            "z": "з",
            "i": "и",
            "j": "й",
            "k": "к",
            "l": "л",
            "m": "м",
            "n": "н",
            "o": "о",
            "p": "п",
            "r": "р",
            "s": "с",
            "t": "т",
            "u": "у",
            "f": "ф",
            "h": "х",
            "c": "ц",
            "y": "ы"
        };

        // --- Функции шифрования/дешифрования ---
        function encryptMirror3(text) {
            return text
                .split(" ")
                .map(word => {
                    let reversed = Array.from(word).reverse().join("");
                    let translit = "";
                    for (const c of reversed) {
                        const x = c.toLowerCase();
                        translit += TRANSLIT_MAP[x] ?? x;
                    }
                    let shifted = "";
                    for (const c of translit) {
                        const x = c.toLowerCase();
                        shifted += QWERTY_LEFT[x] ?? x;
                    }
                    return shifted;
                })
                .join(" ");
        }

        function decodeChunk(str, i) {
            if (str.substr(i, 3) === "sch") return { ch: "щ", len: 3 };
            let two = str.substr(i, 2);
            if (REVERSE_TRANSLIT[two]) return { ch: REVERSE_TRANSLIT[two], len: 2 };
            return { ch: REVERSE_TRANSLIT[str[i]] ?? str[i], len: 1 };
        }

        function decryptMirror3(text) {
            return text
                .split(" ")
                .map(word => {
                    let normal = "";
                    for (const c of word) {
                        normal += QWERTY_RIGHT[c] ?? c;
                    }
                    let result = "";
                    let i = 0;
                    while (i < normal.length) {
                        const part = decodeChunk(normal, i);
                        result += part.ch;
                        i += part.len;
                    }
                    return Array.from(result).reverse().join("");
                })
                .join(" ");
        }

        // --- Вспомогательные компоненты ---
        const colors = [
            "bg-red-500", "bg-orange-500", "bg-green-500",
            "bg-blue-500", "bg-purple-500", "bg-pink-500"
        ];

        function avatarColor(name) {
            let h = 0;
            for (const c of name) {
                h = (h * 31 + c.charCodeAt(0)) >>> 0;
            }
            return colors[h % colors.length];
        }

        function Avatar({ name, online }) {
            return ( <
                div className = "relative w-10 h-10" >
                <
                div className = { `w-full h-full rounded-full flex items-center justify-center font-bold ${avatarColor(name)}` } >
                { name ? .[0] ? .toUpperCase() } <
                /div> {
                    online !== undefined && < div className = { `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-dark-panel ${online ? "bg-green-400" : "bg-gray-500"}` }
                    />} <
                    /div>
                );
            }

            function MessageBubble({ msg, mine }) {
                const [show, setShow] = useState(!msg.encrypted);
                const text = msg.encrypted ? decryptMirror3(msg.text) : msg.text;

                return ( <
                    div className = { `flex ${mine ? "justify-end" : "justify-start"}` } >
                    <
                    div className = { `max-w-[70%] px-4 py-3 rounded-2xl ${mine ? "bg-brand" : "bg-dark-bubble"}` } >
                    {
                        msg.encrypted && <
                        div className = "text-xs text-green-300 mb-1" >
                        🔒 ЗЕРКАЛО - 3 <
                        button className = "ml-2 underline"
                        onClick = {
                            () => setShow(!show) } >
                        { show ? "скрыть" : "открыть" } <
                        /button> <
                        /div>
                    } <
                    p className = "break-words" > { show ? text : msg.text } < /p> <
                    div className = "text-xs opacity-60 text-right" > { msg.time } < /div> <
                    /div> <
                    /div>
                );
            }

            // --- Основной компонент ---
            function App() {
                const [user, setUser] = useState(null);
                const [ready, setReady] = useState(false);
                const [contacts, setContacts] = useState([]);
                const [search, setSearch] = useState("");
                const [found, setFound] = useState(null);
                const [chat, setChat] = useState(null);
                const [messages, setMessages] = useState([]);
                const [input, setInput] = useState("");
                const bottom = useRef();

                // --- Инициализация Firebase и аутентификация ---
                useEffect(() => {
                    const start = () => {
                        const { onAuthStateChanged } = window.FB_AUTH;
                        onAuthStateChanged(window.auth, async (firebaseUser) => {
                            if (!firebaseUser) {
                                await window.FB_AUTH.signInAnonymously(window.auth);
                                return;
                            }
                            const uid = firebaseUser.uid;
                            const username = "air_" + uid.slice(0, 8);
                            const ref = window.FB.doc(window.db, "users", uid);
                            const snap = await window.FB.getDoc(ref);

                            if (!snap.exists()) {
                                await window.FB.setDoc(ref, {
                                    uid,
                                    username,
                                    displayName: "Пользователь " + username,
                                    online: true,
                                    created: window.FB.serverTimestamp()
                                });
                            }

                            const data = (await window.FB.getDoc(ref)).data();
                            setUser(data);
                            setReady(true);
                        });
                    };

                    if (window.auth) {
                        start();
                    } else {
                        window.addEventListener("firebase-ready", start);
                    }
                }, []);

                // --- Загрузка списка контактов ---
                useEffect(() => {
                    if (!user) return;

                    const q = window.FB.query(
                        window.FB.collection(window.db, "users"),
                        window.FB.where("uid", "!=", user.uid)
                    );

                    const unsub = window.FB.onSnapshot(q, snap => {
                        setContacts(snap.docs.map(d => d.data()));
                    });

                    return () => unsub();
                }, [user]);

                // --- Загрузка сообщений выбранного чата ---
                useEffect(() => {
                    if (!user || !chat) return;

                    const ids = [user.uid, chat.uid].sort();
                    const chatId = ids.join("_");

                    const q = window.FB.query(
                        window.FB.collection(window.db, "chats", chatId, "messages"),
                        window.FB.orderBy("created", "asc")
                    );

                    const unsub = window.FB.onSnapshot(q, snap => {
                        setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setTimeout(() => {
                            bottom.current?.scrollIntoView({ behavior: "smooth" });
                        }, 100);
                    });

                    return () => unsub();
                }, [chat, user]);

                // --- Поиск пользователя ---
                async function searchUser() {
                    const value = search.trim();
                    if (!value) {
                        setFound(null);
                        return;
                    }

                    const q = window.FB.query(
                        window.FB.collection(window.db, "users"),
                        window.FB.where("username", "==", value)
                    );

                    const snap = await window.FB.getDocs(q);
                    if (!snap.empty) {
                        setFound(snap.docs[0].data());
                    } else {
                        setFound(null);
                    }
                }

                // --- Отправка сообщения ---
                async function send() {
                    if (!input.trim() || !chat) return;

                    const ids = [user.uid, chat.uid].sort();
                    const chatId = ids.join("_");
                    const text = encryptMirror3(input);

                    await window.FB.addDoc(
                        window.FB.collection(window.db, "chats", chatId, "messages"), {
                            text,
                            encrypted: true,
                            sender: user.uid,
                            created: window.FB.serverTimestamp(),
                            time: new Date().toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            })
                        }
                    );

                    setInput("");
                }

                if (!ready) {
                    return <div className = "h-screen flex items-center justify-center" > Загрузка AirGram... < /div>;
                }

                return ( <
                        div className = "h-screen bg-dark-bg flex" >
                        <
                        div className = "w-80 bg-dark-panel border-r border-dark-line p-4 flex flex-col" >
                        <
                        h1 className = "text-2xl font-bold text-brand mb-4" > AirGram < /h1>

                        <
                        div className = "mb-4" >
                        <
                        input className = "w-full bg-slate-900 p-2 rounded"
                        placeholder = "найти пользователя"
                        value = { search }
                        onChange = { e => setSearch(e.target.value) }
                        /> <
                        button className = "mt-2 bg-brand px-3 py-2 rounded"
                        onClick = { searchUser } >
                        Поиск <
                        /button> <
                        /div>

                        {
                            found && <
                            div onClick = {
                                () => setChat(found) }
                            className = "p-3 bg-slate-800 rounded cursor-pointer" >
                            { found.username } <
                            /div>
                        }

                        <
                        hr className = "my-4 opacity-20" / >

                        <
                        div className = "flex-1 overflow-y-auto" > {
                            contacts.map(c => ( <
                                div key = { c.uid }
                                onClick = {
                                    () => setChat(c) }
                                className = "p-3 hover:bg-slate-800 cursor-pointer rounded" >
                                { c.username } <
                                /div>
                            ))
                        } <
                        /div> <
                        /div>

                        <
                        div className = "flex-1 flex flex-col" > {
                            chat ? ( <
                                >
                                <
                                div className = "p-4 border-b border-dark-line" > { chat.username } < /div>

                                <
                                div className = "flex-1 overflow-y-auto p-4 space-y-3" >
                                { messages.map(m => ( <
                                    MessageBubble key = { m.id }
                                    msg = { m }
                                    mine = { m.sender === user.uid }
                                    />
                                )) } <
                                div ref = { bottom }
                                /> <
                                /div>

                                <
                                div className = "p-4 border-t border-dark-line flex gap-2" >
                                <
                                input className = "flex-1 bg-slate-900 rounded p-3"
                                value = { input }
                                onChange = { e => setInput(e.target.value) }
                                onKeyDown = { e => e.key === "Enter" && send() }
                                /> <
                                button className = "bg-brand px-5 rounded"
                                onClick = { send } >
                                ➤ <
                                /button> <
                                /div> <
                                />
                            ) : <
                            div className = "flex-1 flex items-center justify-center text-gray-400" >
                            Выберите чат <
                            /div>
                        } <
                        /div> <
                        /div>
                    );
                }

                // --- Рендеринг приложения ---
                ReactDOM.createRoot(document.getElementById("root")).render( < App / > );
    </script>
</body>

</html>
